version: '3.8'

services:
  cloudops-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cloudops-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - AWS_REGION=us-east-1
      - PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
